<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — TEAM ACADEMY</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <div class="brand">
        <div class="logo">TA</div>
        <div>TEAM ACADEMY</div>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="courses.html">Courses</a>
        <a href="attendance.html">Attendance</a>
        <a href="fees.html">Fees</a>
        <span id="auth-slot"></span>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="form-card">
      <h1>Create your account</h1>
      <p class="muted">Join TEAM ACADEMY and get started.</p>
      <div class="spacer"></div>
      <form id="signup-form" class="form-row">
        <div class="input">
          <input id="signup-fullname" name="fullName" placeholder=" " required>
          <label for="signup-fullname">Full name</label>
        </div>
        <div class="input">
          <input id="signup-email" name="email" type="email" placeholder=" " required>
          <label for="signup-email">Email</label>
        </div>
        <div class="input">
          <input id="signup-password" name="password" type="password" placeholder=" " required>
          <label for="signup-password">Password</label>
          <div class="hint"><button type="button" id="toggle-signup-password" class="btn" style="padding:4px 8px;">Show/Hide</button></div>
        </div>
        <div class="input">
          <select id="signup-course" name="course">
            <option value="">Select a course (optional)</option>
            <option value="MPC">MPC</option>
            <option value="Class10-Maths">Class10-Maths</option>
            <option value="Computers">Computers</option>
          </select>
          <label for="signup-course">Course</label>
        </div>
        <button class="btn primary" type="submit">Create Account</button>
      </form>
      <div class="spacer"></div>
      <p class="center muted">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> TEAM ACADEMY.</div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const p = new URLSearchParams(location.search).get('course');
    if (p) {
      const sel = document.getElementById('signup-course');
      if ([...sel.options].some(o => o.value === p)) sel.value = p;
    }
  </script>
</body>
</html>
